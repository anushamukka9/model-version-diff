[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-version-diff"
version = "0.1.0"
description = "Diff model versions: config/hyperparameter diffs, weight-stat deltas, dataset fingerprint comparison, and prediction flip analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anusha Mukka" }]
keywords = ["mlops", "model-versioning", "diff", "model-registry", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://anushamukka.com"
Repository = "https://github.com/anushamukka9/model-version-diff"

[project.scripts]
model-version-diff = "model_version_diff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
